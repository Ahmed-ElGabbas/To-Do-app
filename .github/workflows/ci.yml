name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasko-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasko-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

  postgres:
    name: Migrations and tests against real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasko-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasko
          POSTGRES_PASSWORD: tasko
          POSTGRES_DB: tasko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasko"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: tasko
      DB_PASSWORD: tasko
      DB_DATABASE: tasko
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasko-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run:prod

      - name: Verify migration state
        run: npm run migration:show:prod

      - name: Integration tests (Postgres)
        run: npm run test:integration

      - name: E2E tests (Postgres)
        run: npm run test:e2e -- --runInBand

  docker:
    name: Build Docker image
    needs: [test, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasko-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tasko-backend:${{ github.sha }} .
