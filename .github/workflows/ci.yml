name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasko-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasko-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

  docker:
    name: Build Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasko-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tasko-backend:${{ github.sha }} .
